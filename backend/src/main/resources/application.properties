spring.application.name=deepfake-speech-detection-backend

# Configuration for storing uploaded profile pictures
profile.pictures.directory=${PROFILE_PICTURES_DIR:profile-pictures/}

# Email configuration for two-step verification
spring.mail.host=${MAIL_HOST:smtp.outlook.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MySQL database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/deepfake_detection}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
